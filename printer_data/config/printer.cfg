#################################################
# modification for BTT SFS v2.0
#[filament_switch_sensor fila]
#switch_pin: PC1 # Qidi settings !PC1
#pause_on_runout: False # factory default True
#runout_gcode:
#            PAUSE # [pause_resume] required in printer.cfg
#            SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
#insert_gcode:
#            M117 Filament switch inserted
#event_delay: 3.0
#pause_delay: 0.5

[filament_switch_sensor fila]
switch_pin: PC1  # Qidi: !PC1  / SFS: PC1
pause_on_runout: False
runout_gcode:
            SET_FILAMENT_SENSOR SENSOR=encoder_fila ENABLE=0
            KEEP_PRINTING_AFTER_FIL_RUNOUT D={600}

# Addon for BTT SFS V2.0
[filament_motion_sensor encoder_fila]
switch_pin: PC3
detection_length: 7.0 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
            PAUSE # [pause_resume] required in printer.cfg

[include macros/keep_extruding_after_filament_runout_detected.cfg]

