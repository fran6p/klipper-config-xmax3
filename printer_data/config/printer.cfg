#Qidi X-Max3

# This file contains common pin mappings for Qidi X-4 and also X-6
# (based on Makerbase MKS-SKRPI, controler is different STM32F407)
# boards. To use this config, the firmware should be compiled for the
# stm32f401 variant. When running "make menuconfig", select the 32KiB
# bootloader, and enable "Serial for communication" and select the
# "on USART1 PA10/PA9"

# The "make flash" command does not work on the Qidi boards. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "X_4.bin" on the root of an SD card (FAT32) and then
# power off printer, wait at least 30 seconds for supercapacitor to
# discharge, finally power on the Qidi printer with that SD card.

# See docs/Config_Reference.md for a description of parameters.

