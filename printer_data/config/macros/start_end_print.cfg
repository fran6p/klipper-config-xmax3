[gcode_macro PRINT_WARMUP]
description: Perform initial homing and heating tasks
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP | default(190) | float %}
    {% set BED_TEMP = params.BED_TEMP | default(60) | float %}

    # Homing, QGL, pre-warming print nozzle etc.
    M104 S{EXTRUDER_TEMP * 0.75}        # set extruder temperature to 75%
    M140 S{BED_TEMP}                    # set bed temperature
    G28                                 # home printer

    # wait for the print bed to reach thermal equilibrium
    HEAT_SOAK HEATER='heater_bed' TARGET={BED_TEMP} SOAKER='temperature_sensor chamber'


[gcode_macro PRINT_START]
gcode:
# verify that the necessary parameters are in the g-code file
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set MIN_X = params.MIN_X|default(10)|float %}
    {% set MIN_Y = params.MIN_Y|default(10)|float %}
    
    # Turn on case light 
    SET_PIN PIN=caselight VALUE=1 
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0
    # Home the printer
    G28
    G0 Z50 F600                                      # Lower the bed while pre-heating the bed and chamber      
    # Heat the bed and chamber
    M140 S{CHAMBER_TEMP}                             # Start heating the chamber (if set) #!was M141 before...
    M190 S{BED_TEMP}                                 # Heat the bed and wait for it to finish
    M191 S{CHAMBER_TEMP}                             # Wait for the chamber to finish heating
    # Nozzle pre heat
    G1 Z5 F3000                                      #  Move the nozzle near the bed
    M109 S150                                        # Heats the nozzle to 150c
    # Bed meshing
    G28 Z                                            # Re-probe the center of the bed before leveling
    BED_MESH_CLEAR                                   # Clears old saved bed mesh (if any)
    BED_MESH_CALIBRATE ADAPTIVE=1                    # Starts bed mesh via Klipper Adaptive MeshingG0 X0 Y0 Z50 F6000
    # Smart_Park                                      # Utilize KAMP Smart_Park Macro                 
    # Heat the extruder and prepare for printing
    M109 S{EXTRUDER_TEMP}                            # Heat the extruder
    G91                                              # Incremental positioning 
    #M83                                              # Set extruder to relative mode
    # Priming Section
    #LINE_PURGE                                       # KAMP Purging
    G90                                              # Absolute positioning


[gcode_macro PRINT_END]
gcode:
	#G1 Z275 F1000 ; lower platform to bottom
	#G28 X0 Y300; home X-axis Y-Axis
	M104 S0 ; Turn off Extruder
	M106 S0 ; Turn off Fan
	M84 ; disable motors
    {% if printer.heater_bed.temperature > 60 %}
        M118 Start gradual bed cooling ({printer.heater_bed.temperature}C°).
        M118 reduce temp to ({printer.heater_bed.temperature - 5 }C°).
        UPDATE_DELAYED_GCODE ID=gradual_cooldown DURATION=300
    {% else %}
        M118 No Gradual bed cooling necessary ({printer.heater_bed.temperature}C°).
    	M140 S0 ; turn off bed
    	M81 ; disable Power
        M118 Print Complete!
    {% endif %}

[delayed_gcode gradual_cooldown]
gcode:
    {% if printer.heater_bed.target > 40 %}
        M118 reduce temp to ({printer.heater_bed.target - 5 }C°).
        M140 S{ printer.heater_bed.target - 5 }
        UPDATE_DELAYED_GCODE ID=gradual_cooldown DURATION=300
    {% else %}
        M118 Gradual bed cooling finished ({printer.heater_bed.temperature}C°).
    	M140 S0 ; turn off bed
    	#M81 ; disable Power
        M118 Print Complete!
    {% endif %}