#    wifi.cfg    #

[gcode_macro WIFI_MODIFY]
description: Change Wi-Fi SSID & Password,
   WIFI_CHANGE SSID=yourSSID PASSWORD=yourPassword
gcode:
    {% set ssid = params.SSID|default(KLIPPER)|string %}
    {% set password = params.PASSWORD|default(1234)|string %}
    RUN_SHELL_COMMAND CMD=WIFI_MODIFY PARAMS="'{ssid}' '{password}'" # paramètres passés ${1} ${2}

[gcode_shell_command WIFI_MODIFY]
command: bash /home/mks/printer_data/config/scripts/modify_wifi.sh
timeout: 30.
#    verbose: True

[gcode_macro WIFI_DELETE]
description: Forget SSID Wi-Fi
gcode:
    {% set ssid = params.SSID|default(KLIPPER)|string %}
    RUN_SHELL_COMMAND CMD=WIFI_DELETE PARAMS="'{ssid}'" # paramètre passé ${1}

[gcode_shell_command WIFI_DELETE]
command: bash /home/mks/printer_data/config/scripts/forget_wifi.sh
timeout: 30.
#    verbose: True

[gcode_macro WIFI_SHOW]
description: Show saved Wi-Fi
gcode:
    {% set passwd = params.PASSWORD|default(makerbase)|string %}
    RUN_SHELL_COMMAND CMD=WIFI_SHOW PARAMS={passwd}

[gcode_shell_command WIFI_SHOW]
command: bash /home/mks/printer_data/config/scripts/show_wifi.sh
timeout: 60.
#    verbose: True