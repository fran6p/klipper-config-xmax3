#####################################
#           Clean Backups           #
#     Version 1.2.5  2023-2-17      #
#####################################
# From rootiest GH
#   This script cleans backup files from the base folder by moving them 
#       to an archive folder.
[delayed_gcode clean_backups]
initial_duration: 2
gcode:
    RUN_SHELL_COMMAND CMD=backup_cleaner

[gcode_shell_command backup_cleaner]
command: bash /home/mks/printer_data/config/scripts/clean_backups.sh
timeout: 60.
verbose: True

#####################################
#      Fix ZippyPrint Scripts       #
#      Version 1.0.5 2023-3-28      #
#####################################
# This macro will fix permissions on all scripts in your config
# 

# You must have gcode_shell_command installed to use this macro/script.
# 
############## NOTE: ################ 
#  This will make all .sh and .py files execuable in your config!
#  Please use caution if you do not trust all scripts in your config
[gcode_macro FIX_SCRIPTS]
gcode:
    RUN_SHELL_COMMAND CMD=fix_scripts

[gcode_shell_command fix_scripts]
command: bash /home/mks/printer_data/config/scripts/fix_scripts.sh /home/mks/printer_data/config/scripts/
timeout: 60.
verbose: True

# Sauvegarde fichiers de configuration sur Github (https://github.com/Staubgeborener/klipper-backup)
# RTFM:  https://klipperbackup.xyz/
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh $0"
timeout: 90.0
verbose: True

[gcode_shell_command klipperscreen_halt]
 command: bash -c "bash $HOME/printer_data/config/scripts/halt_klipperscreen.sh"
 timeout: 30
 verbose: True

[gcode_macro KS_LAN_HALT]
 description: Remote Shutdown Klipperscreen
 gcode:
     RUN_SHELL_COMMAND CMD=klipperscreen_halt
