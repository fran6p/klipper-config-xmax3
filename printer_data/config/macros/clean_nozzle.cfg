[gcode_macro NOZZLE_CLEANING]
description: Clean nozzle  (use X position_min in [steeper_x])
variable_start_x: -5.0
variable_start_y: 20
variable_start_z: 0.5
variable_wipe_dist: -10
variable_wipe_qty: 5
variable_wipe_spd: 60
variable_raise_distance: 20
gcode:
    G90
    G0 X{start_x} Y{start_y} F2400
    G0 Z{start_z} F1500
    {% for wipes in range(1, (wipe_qty + 1)) %}
        G0 Y{start_y + wipe_dist} F{wipe_spd * 60}
        G0 Y{start_y} F{wipe_spd * 60}
    {% endfor %}
    G0 Z{raise_distance} 