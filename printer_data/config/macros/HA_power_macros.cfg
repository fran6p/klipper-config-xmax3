#=====================================================
# Power Operations / HA Plug
#=====================================================
[gcode_macro POWER_ON_KLIPPERSCREEN]
gcode:
  {action_call_remote_method("set_device_power",
                             device="Klipperscreen",
                             state="on")}
							 
[gcode_macro POWER_OFF_KLIPPERSCREEN]
gcode:
  KLIPPERSCREEN_SHUTDOWN  # GShell command to shutdown Klipperscreen
  G4 P30000                   # Wait 30s before power off
  {action_call_remote_method("set_device_power",
                             device="Klipperscreen",
                             state="off")}
  
[gcode_macro POWER_OFF_PRINTER]
gcode:
  {action_call_remote_method("set_device_power",
                             device="Qidi_XMax3",
                             state="off")}
  
[gcode_macro POWER_OFF_ALL]
gcode:
  POWER_OFF_KLIPPERSCREEN
  POWER_OFF_PRINTER

