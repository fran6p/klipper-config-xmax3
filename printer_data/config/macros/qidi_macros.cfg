[gcode_macro G29]
variable_k:1
gcode:
  {% if k|int==1 %}
    BED_MESH_CLEAR      #清除调平数据
#    G28   
    BED_MESH_CALIBRATE PROFILE=kamp  #自动调平
  {% endif %}

[gcode_macro G30]
gcode:
  BED_MESH_CLEAR      #清除调平数据
#  G28 
  BED_MESH_CALIBRATE mesh_min=10,10  mesh_max=310,310  METHOD=manual #手动动调平

[gcode_macro G31]
gcode:
  SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro G32]
gcode:
  SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0

[gcode_macro M0]
gcode:
  PAUSE

[gcode_macro M25]
rename_existing: M9925
gcode:
  PAUSE

[gcode_macro M84]
rename_existing: M84.1
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
  SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
  SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
  SET_STEPPER_ENABLE STEPPER=extruder enable=0
  #SET_KINEMATIC_POSITION

# Qidi M106 Q1 Pro
# Use names instead of values
# - cooling_fan => fan0
# - auxiliary_cooling_fan => fan2
# - chamber_circulation_fan => fan3
# Use "SET_FAN_SPEED FAN= SPEED= "
#  => [fan_generic "name"_fan]
#     name={cooling, auxiliary, chamber_circulation}
# Old used "SET_PIN PIN= VALUE= "
#  => [output_pin fanX]
#     X={0, 2, 3}
#
[gcode_macro M106]
gcode: 
    {% set p = params.P|default(0)|int %}

    {% if p == 2 %} 		 
	    {% if params.S is defined %}
	        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={(params.S|float / 255.0)}
	    {% else %}
	        SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
	    {% endif %}
    {% endif %}
	  		 
	{% if p == 0 %}
	    {% if params.S is defined %}
	        SET_FAN_SPEED FAN=cooling_fan SPEED={(params.S|float / 255.0)}
	    {% else %}
	        SET_FAN_SPEED FAN=cooling_fan SPEED=1
	    {% endif %}
	{% endif %}
	  		 
	{% if p == 3 %}
	    {% if params.S is defined %}
	        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED={(params.S|float / 255.0)}
	    {% else %}
	        SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1
	    {% endif %}
	{% endif %}

[gcode_macro M107]
gcode:  
  SET_FAN_SPEED FAN=cooling_fan SPEED=0
#  SET_FAN_SPEED FAN=auxiliary_fan SPEED=0 #fan2
#  SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0  #fan3

[gcode_macro M204]
rename_existing: M99204
gcode:
  {% if params.S is defined %}
    {% set s = params.S|float %}
  {% endif %}
  {% if params.P is defined %}
    {% if params.T is defined %}
      {% set s = [params.P|float ,params.T|float] | min %}
    {% endif %}
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={s}
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}

[gcode_macro M290]
gcode:
  SET_GCODE_OFFSET Z_ADJUST={params.Z}

[gcode_macro M303]
gcode:
  {% if params.E is defined %}
    {% if params.S is defined %}
      {% if (params.E|int)==-1 %} 
        PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
      {% endif %}
      {% if (params.E|int)==0 %}
        PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro M603]
description: filament unload
gcode:
  G92 E0
# v4.3.10
#  G0  E15 F400
#  G4  P1000
#  G92 E0
#  G1  E-80 F800
  G0 E-100 F400

# ajout v4.3.12
[gcode_macro M604] 		 
description: filament load 		 
gcode: 		 
  M83 		 
  G1  E80 F400

[gcode_macro M900]
gcode:
  {% if params.K is defined %} 
    SET_PRESSURE_ADVANCE ADVANCE={params.K}
  {% endif %}  
  {% if params.T is defined %}    
    SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
  {% endif %} 

[gcode_macro M901]
gcode:
  G28
  SHAPER_CALIBRATE
  SAVE_CONFIG

[gcode_macro M1029]
gcode:
#  X_TWIST_PROFILE_LOAD NAME=default
#  X_TWIST_COMPENSATE_MESH MESH_NAME=default COMPENSATION_NAME=default
#  SAVE_CONFIG
 
[gcode_macro M4029]
gcode:
  BED_MESH_CLEAR
  G91 		 
	G1 Z10 F600 		 
	G90
  G28
  G1 X{printer.toolhead.axis_maximum.x/2 - printer.probe["x_offset"]} Y{printer.toolhead.axis_maximum.y/2 - printer.probe["y_offset"]} F7800
  G1 Z15 F600
  ABORT
  PROBE_CALIBRATE
  ABORT
  G0 Z0

# Addons BTT SFS v2.0
[gcode_macro M8029]
gcode:
  {% if params.D is defined %}
    {% if (params.D|int)==1 %} 
      SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=1
      SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1 #BTT SFS v2.0 addition
    {% endif %}
    {% if (params.D|int)==0 %} 
      SET_FILAMENT_SENSOR SENSOR=fila  ENABLE=0
      SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0 #BTT SFS v2.0 addition
    {% endif %}
  {% endif %}

[gcode_macro RESPOND_INFO] 		 
variable_S:0 		 
gcode: 		 
    {% if params.S is defined %} 		 
        {% set s = params.S|int %} 		 
        {% if s == 0 %} 		 
            { action_respond_info("Nozzle cooled")  } 		 
        {% endif %} 		 
    {% endif %}