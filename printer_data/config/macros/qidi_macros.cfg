[gcode_macro SHAPER_CALIBRATE]
rename_existing: RESHAPER_CALIBRATE
gcode:
  RESHAPER_CALIBRATE FREQ_START=30 FREQ_END=135  # 150 (Qidi)

[gcode_macro HOT_CALIBRATE_START]
variable_k: 0
gcode:
  {% if k == 0 %}
    {% if printer['heater_generic chamber'].temperature > 44 %}
      SET_GCODE_VARIABLE MACRO=HOT_CALIBRATE_END VARIABLE=hot_set VALUE=1
      SET_GCODE_OFFSET Z_ADJUST=-0.10 MOVE=0
      SET_GCODE_VARIABLE MACRO=HOT_CALIBRATE_START VARIABLE=k VALUE=1
    {% endif %}
  {% endif %}

[gcode_macro HOT_CALIBRATE_END]
variable_hot_set: 0
gcode:
  {% if  hot_set == 1 %}
    SET_GCODE_VARIABLE MACRO=HOT_CALIBRATE_END VARIABLE=hot_set VALUE=0
    SET_GCODE_OFFSET Z_ADJUST=+0.10 MOVE=0
    SET_GCODE_VARIABLE MACRO=HOT_CALIBRATE_START VARIABLE=k VALUE=0
  {% endif %}

[gcode_macro PRINT_START]
gcode:
  SFS_DISABLE  ; Disable BTT SFS v2.0 filament encoder before print starts to stop false positives in purge layer before print.
  HOT_CALIBRATE_START

[gcode_macro PRINT_START_QD]
gcode:
  HOT_CALIBRATE_START

[gcode_macro PRINT_END]
gcode:
  M106 P2 S0
  M106 P0 S0
  M106 P3 S0  #关闭活性炭风扇
  M104 S0
  M140 S0
  M141 S0
  M220 S100
  M221 S100
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
  CLEAR_PAUSE
  HOT_CALIBRATE_END
  SET_FILAMENT_SENSOR SENSOR=fila ENABLE=0
  SFS_DISABLE ; disable BTT SFS v2 encoder sensor
  M84
#  SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
#  SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
#  SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
#  SET_STEPPER_ENABLE STEPPER=extruder enable=0
  BED_MESH_CLEAR      #恢复调平数据
  BED_MESH_PROFILE LOAD=default
  G31
  BEEP I=2 DUR=500

[gcode_macro PRINT_END_POWEROFF]
gcode:
  M107
  M104 S0
  M140 S0
  G28 Z
  M84
#  BEEP I=2 DUR=500
  M81	
    
