[gcode_macro start_tones]
description: chirp to indicate starting
gcode:
    M300 S1000 P500
    M300 S440  P200
    M300 S220  P100

[gcode_macro print_start_tune]
description: tune to indicate starting to print
gcode:
    M300 S1000 P500
    M300 S440  P200
    M300 S220  P250
    M300 S440  P200
    M300 S220  P250
    M300 S440  P200
    M300 S1000 P1000

[gcode_macro end_tones]
description: Make Print Completed Tones
gcode:
    M300 S440 P200 
    M300 S660 P250
    M300 S880 P300

[gcode_macro end_tune]
description: Ending tune
gcode:
    M300 S3135 P75
    M300 S3135 P150
    M300 S1760 P150
    M300 S1760 P150
    M300 S2637 P150
    M300 S2637 P150
    M300 S3135 P150

[gcode_macro change_tune]
description: Change filament tune
gcode:
    M300 S440 P200
    M300 S660 P250
    M300 S880 P300

[gcode_macro mesh_tune]
description: Bed meshing
gcode:
    M300 S440 P200
    M300 S880 P300
    M300 S660 P250
